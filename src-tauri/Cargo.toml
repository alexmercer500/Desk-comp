[package]
name = "desk-companion"
version = "0.9.0"
description = "A small character that lives in the corner of your desktop"
edition = "2021"

[workspace]
members = [".", "hook"]

# Debug builds without debug info: keeps target/debug far smaller (PDBs were ~20 GB).
[profile.dev]
debug = 0

[lib]
name = "desk_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "sync", "macros"] }
# Phone link (phone/): TLS server with a pinned self-signed certificate. All on
# ring, which is already here for the updater; aws-lc would need extra build tools.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pinned to a minor version: updates.rs adjusts its HTTP client (configure_client), which may change between minors.
tauri-plugin-updater = "~2.13"
# Phone relay (phone/relay.rs): a WebSocket client to the relay, TLS on ring too.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
